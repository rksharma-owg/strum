name: Strum 498 preflight
on:
  push:
    branches: [codex/ci-strum-498]
    paths: [.github/workflows/strum-preflight.yml]
permissions:
  contents: read
env:
  PATCH_SHA: d8f8dd14a7363ef01d504c4e7e5d5f995fce99a1
  BASELINE_SHA: 90775661c7710b546e25af5e044dc687f1df0e7d
  CARGO_TERM_COLOR: always
jobs:
  checks:
    name: combined / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PATCH_SHA }}
          fetch-depth: 0
      - name: Verify tested commit
        shell: bash
        env:
          TESTED_SHA: ${{ env.PATCH_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          git rev-parse HEAD HEAD^{tree}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --all-targets --all-features -- -D warnings
  test:
    name: combined / tests and PHF / ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.71.1, stable, beta, nightly]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PATCH_SHA }}
          fetch-depth: 0
      - name: Verify tested commit
        shell: bash
        env:
          TESTED_SHA: ${{ env.PATCH_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          git rev-parse HEAD HEAD^{tree}
      - name: Install MSRV resolver
        if: matrix.toolchain == '1.71.1'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Lock MSRV-compatible dependencies
        if: matrix.toolchain == '1.71.1'
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo generate-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Build
        run: cargo build --verbose
      - name: Tests
        run: cargo test --verbose
      - name: PHF regression tests
        run: cargo test -p strum_tests --features test_phf --test phf
      - name: All features
        run: cargo test --all-features --verbose
  repairs:
    name: independent / ${{ matrix.kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: clippy
            toolchain: stable
            sha: 657ff605dd4ccd68cca826a2d58bf79e75121e1c
          - kind: msrv
            toolchain: 1.71.1
            sha: 9cb06b502d6ea76b066ebc0ea1b8515b8fcd6e6f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - name: Verify tested commit
        shell: bash
        env:
          TESTED_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          git rev-parse HEAD HEAD^{tree}
      - name: Install MSRV resolver
        if: matrix.toolchain == '1.71.1'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Lock MSRV-compatible dependencies
        if: matrix.toolchain == '1.71.1'
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo generate-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.kind == 'clippy' && 'clippy' || '' }}
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Build
        run: cargo build --verbose
      - name: Tests
        run: cargo test --verbose
      - name: Clippy
        if: matrix.kind == 'clippy'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: All features on MSRV
        if: matrix.kind == 'msrv'
        run: cargo test --all-features --verbose
